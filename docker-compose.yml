services:
  akson:
    build: .
    container_name: akson
    restart: unless-stopped
    ports:
      # Loopback only: Akson controls the host Docker daemon. To reach it from another
      # machine, put a TLS reverse proxy in front and set AKSON_TOKEN, or change this deliberately.
      - "127.0.0.1:3001:3001"
    volumes:
      # Akson manages containers through the host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - akson-data:/data
    environment:
      # Optional: require a token for the API (see README).
      - AKSON_TOKEN=${AKSON_TOKEN:-}
      # Optional: e-mail for free Let's Encrypt HTTPS certificates via Traefik.
      - ACME_EMAIL=${ACME_EMAIL:-}
      # Optional: host IP deployed apps publish their ports on (default 127.0.0.1).
      - AKSON_PUBLISH_IP=${AKSON_PUBLISH_IP:-}

volumes:
  akson-data:
